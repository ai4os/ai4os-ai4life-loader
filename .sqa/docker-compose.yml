version: "3.6"

services:
  testing:
    #image: "ai4oshub/ai4os-ai4life-loader:cicd"
    container_name: "${BUILD_TAG}"
    hostname: "${BUILD_TAG}"
    working_dir: /srv/app
    build:
      context: ./.sqa
      args:
        branch: ${BUILD_BRANCH:-dev}
        CACHEBUST: ${BUILD_NUMBER:-1}
    volumes:
      - type: bind
        source: ./
        target: /srv/app