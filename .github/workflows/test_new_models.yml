name: Test New Models

on:
  workflow_run:
    workflows: ["Filter v0_5 Models Workflow"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      base_ref:
        description: "Compare filtered_models.json against this branch (empty = previous commit)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  test-new-models:
    runs-on: ubuntu-latest
    # Only run if the upstream filter workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # workflow_run always starts on the default branch, so check out the
        # branch the filter workflow ran on (or the one chosen manually)
        ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        fetch-depth: 0  # Full history needed to diff previous filtered_models.json

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip "setuptools<81" wheel
        pip install "marshmallow<4" "numpy>=2.0,<2.1" "pydantic<=2.12" "xarray<2024.10"
        pip install -r requirements.txt -r requirements-test.txt
        pip install -e .

    # ── Step 1: Detect new models ──
    - name: Detect new models
      id: detect
      env:
        BASE_REF: ${{ github.event.inputs.base_ref }}
      run: |
        python scripts/detect_new_models.py

    - name: Check if new models exist
      id: check
      run: |
        if [ -s scripts/new_models.txt ]; then
          echo "has_new_models=true" >> $GITHUB_OUTPUT
          echo "New models found:"
          cat scripts/new_models.txt
        else
          echo "has_new_models=false" >> $GITHUB_OUTPUT
          echo "No new models found, skipping tests."
        fi

    # ── Step 2: Test prediction for new models ──
    - name: Test new models
      id: test
      if: steps.check.outputs.has_new_models == 'true'
      env:
        # Collect every model, not only one per architecture family
        AI4LIFE_TEST_ALL_MODELS: "1"
      run: |
        python scripts/test_new_models.py scripts/new_models.txt
      continue-on-error: true
      # each model has its own limit (MODEL_TEST_TIMEOUT); this caps the whole step
      timeout-minutes: 300

    - name: Read test results
      id: results
      if: steps.check.outputs.has_new_models == 'true'
      run: |
        if [ -f scripts/test_results.json ]; then
          echo "Test results:"
          cat scripts/test_results.json
          FAILED_COUNT=$(python -c "import json; d=json.load(open('scripts/test_results.json')); print(len(d['failed']))")
          echo "failed_count=$FAILED_COUNT" >> $GITHUB_OUTPUT
        else
          echo "failed_count=0" >> $GITHUB_OUTPUT
        fi

    # ── Step 3: Remove failed models from filtered_models.json ──
    - name: Remove failed models
      id: remove
      if: steps.check.outputs.has_new_models == 'true' && steps.results.outputs.failed_count != '0'
      run: |
        python scripts/remove_failed_models.py scripts/test_results.json

    - name: Commit cleaned filtered_models.json
      if: steps.check.outputs.has_new_models == 'true' && steps.results.outputs.failed_count != '0'
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add models/filtered_models.json
        git commit -m "Remove failed models from filtered_models.json"
        git push origin HEAD:${{ github.event.workflow_run.head_branch || github.ref_name }}

    # ── Step 4: Open one GitHub issue per failed model (skip if already open) ──
    - name: Generate issue body
      if: steps.check.outputs.has_new_models == 'true' && steps.results.outputs.failed_count != '0'
      run: |
        python scripts/generate_issue.py scripts/test_results.json

    - name: Create GitHub issue (skip if already open)
      if: steps.check.outputs.has_new_models == 'true' && steps.results.outputs.failed_count != '0'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Titles of automated issues that are already open
        gh issue list --state open --label automated --limit 500 \
          --json title --jq '.[].title' > open_titles.txt

        # One line per failed model
        python -c "import json; [print(f['model']) for f in json.load(open('scripts/test_results.json'))['failed']]" > failed_models.txt

        while IFS= read -r model; do
          [ -z "$model" ] && continue
          title="[AI4Life] Prediction test failed: $model"
          if grep -Fxq "$title" open_titles.txt; then
            echo "Issue already open for $model, not creating another."
          else
            echo "Opening issue for $model"
            gh issue create --title "$title" \
              --label bug --label automated \
              --body-file scripts/issue_body.md
          fi
        done < failed_models.txt

    # ── Upload artifacts for debugging ──
    - name: Upload test artifacts
      if: steps.check.outputs.has_new_models == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          scripts/new_models.txt
          scripts/test_results.json
