name: Filter v0_5 Models Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"  # Runs every Sunday at midnight UTC

permissions:
  contents: write

jobs:
  filter_models:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip "setuptools<81" wheel
        pip install "marshmallow<4" "numpy>=2.0,<2.1" "pydantic<=2.12" "xarray<2024.10"
        pip install -r requirements.txt

    - name: Download index.json
      run: |
        curl -fsSL -o models/index.json https://raw.githubusercontent.com/bioimage-io/collection/refs/heads/gh-pages/index.json

    - name: Run Filter Script
      run: |
        python ai4life/filter_v0_5_models.py --input models/index.json --output models/filtered_models.json
      

    - name: Configure Git
      run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Commit Changes
      run: |
         git add -f models/filtered_models.json models/index.json
         git commit -m "Update filtered_models.json models/index.json" || echo "No changes to commit"
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
        branch: ${{ github.ref_name }}
